[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimate-ui-design-promcp"
version = "1.0.2"
description = "Token-first UI design pipeline as a ProMCP-native server (triadic can_do/read_*/do_* over FastMCP): design intelligence, extraction, token generation, contrast, motion, and audit for React/Tailwind v4 + shadcn and Flutter (iOS/Android)."
authors = [{ name = "Alejandro Andrade" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "promcp", "fastmcp", "design-tokens", "ui", "tailwind", "shadcn", "flutter", "wcag", "apca"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "promcp>=0.3.0,<0.4",
    "fastmcp>=3.4,<4",
]

[project.optional-dependencies]
extract = ["playwright>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
ultimate-ui-design-promcp = "server:main"

[project.urls]
Homepage = "https://github.com/alexlqi/ultimate-ui-design-promcp"
Repository = "https://github.com/alexlqi/ultimate-ui-design-promcp"
Author = "https://github.com/alexlqi"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
include = ["ultimate_ui*"]

[tool.setuptools.package-data]
ultimate_ui = ["knowledge/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
